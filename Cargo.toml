[package]
name = "cargo-app"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-only"
authors = ["Samuel Rüegger"]
description = "A dual-pane file transfer application for GNOME"

[dependencies]
gtk = { version = "0.10", package = "gtk4", features = ["v4_16"] }
libadwaita = { version = "0.8", features = ["v1_6"] }
glib = "0.21"
gio = "0.21"
gettext-rs = { version = "0.7", features = ["gettext-system"] }
